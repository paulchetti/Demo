services:
  - type: web
    name: trading-trends-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: tradingtrendsbeta@gmail.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
